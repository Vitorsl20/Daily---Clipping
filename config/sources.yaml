# Fontes do clipping. Edite à vontade — o código lê este arquivo a cada execução.
#
# rss_app: feeds pagos do RSS.app (outlets com paywall/anti-bot). Sempre buscados com
#   UM único cache-buster numérico `?_=<unix>` e com o loop de retry obrigatório.
# secondary: fontes secundárias do Brasil — SEMPRE testadas, toda execução.
# outlets: demais veículos (feeds RSS próprios ou, se falharem, a página de listagem).
#
# Para cada fonte em `secondary`/`outlets`, `rss` e `listing` são tentados nessa ordem;
# a primeira URL que responder com itens é usada. `site_query` gera, além disso, uma busca
# no Google News restrita ao domínio (rede de segurança se o feed/listagem falhar).

rss_app:
  - name: Valor Econômico — Finanças
    outlet: Valor Econômico
    url: https://rss.app/feeds/93Gss6DQJjvs1MF7.xml
  - name: Valor Econômico — Empresas
    outlet: Valor Econômico
    url: https://rss.app/feeds/wSp0fjgKEdlHjEUa.xml
  - name: O Globo — Economia
    outlet: O Globo
    url: https://rss.app/feeds/j1RxntBhrxooacg3.xml
  - name: Estadão — Economia
    outlet: Estadão
    url: https://rss.app/feeds/4RjcVw3H5e7DmdG8.xml
  - name: Folha de S.Paulo — Mercado
    outlet: Folha de S.Paulo
    url: https://rss.app/feeds/h8BtCrfrAHD1oko8.xml
  - name: Veja — Economia
    outlet: Veja
    url: https://rss.app/feeds/dGRigh28TFfEpFM5.xml
  - name: UOL — Economia
    outlet: UOL
    url: https://rss.app/feeds/QvbijqzxcITnnH9Q.xml
  - name: Pipeline Valor
    outlet: Pipeline Valor
    url: https://rss.app/feeds/GUhs3m0MhToqgk6M.xml
  - name: Brazil Journal — Negócios
    outlet: Brazil Journal
    url: https://rss.app/feeds/4a9UtJ1pZ8ToWVps.xml
  - name: Seu Dinheiro — Últimas notícias
    outlet: Seu Dinheiro
    url: https://rss.app/feeds/f2zmMrJ3WJEHoavK.xml

# Canais NATIVOS dos mesmos veículos do RSS.app — independentes do RSS.app.
# A cada execução o código:
#   1) lê https://<host>/robots.txt e pega os "Sitemap:" de notícias (Google News sitemaps:
#      título + horário exato de publicação, atualizados em minutos);
#   2) procura <link rel="alternate" type="application/rss+xml"> na página inicial (RSS próprio);
#   3) tenta também as URLs listadas em `try` (palpites comuns; as que não existirem são ignoradas).
# `paths`: se preenchido, só itens cuja URL contém um desses trechos (ex.: seção de economia).
# `prefilter: true`: veículo generalista → só entram títulos/URLs com termos do setor ou nomes de empresas.
native_sites:
  - {outlet: Valor Econômico, host: valor.globo.com, country: BR}
  - {outlet: Pipeline Valor, host: pipelinevalor.globo.com, country: BR}
  - {outlet: O Globo, host: oglobo.globo.com, country: BR, paths: [/economia/], prefilter: true}
  - outlet: Estadão
    host: www.estadao.com.br
    country: BR
    paths: [/economia/]
    prefilter: true
    try:
      - "https://www.estadao.com.br/arc/outboundfeeds/news-sitemap/?outputType=xml"
      - "https://www.estadao.com.br/arc/outboundfeeds/feeds/rss/sections/economia/?outputType=xml"
  - outlet: Folha de S.Paulo
    host: www1.folha.uol.com.br
    country: BR
    paths: [/mercado/]
    prefilter: true
    try: ["https://feeds.folha.uol.com.br/mercado/rss091.xml"]
  - outlet: Veja
    host: veja.abril.com.br
    country: BR
    paths: [/economia/]
    prefilter: true
    try: ["https://veja.abril.com.br/economia/feed/", "https://veja.abril.com.br/feed/"]
  - {outlet: UOL, host: economia.uol.com.br, country: BR, prefilter: true}
  - outlet: Brazil Journal
    host: braziljournal.com
    country: BR
    prefilter: true
    try: ["https://braziljournal.com/feed/"]
  - outlet: Seu Dinheiro
    host: www.seudinheiro.com
    country: BR
    prefilter: true
    try: ["https://www.seudinheiro.com/feed/"]

# GDELT (índice público de notícias, atualizado a cada 15 min, sem chave): uma consulta por domínio.
gdelt_domains:
