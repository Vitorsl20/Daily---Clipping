  - {outlet: Veja, domain: veja.abril.com.br, country: BR, prefilter: true}
  - {outlet: UOL, domain: uol.com.br, country: BR, prefilter: true}
  - {outlet: Brazil Journal, domain: braziljournal.com, country: BR, prefilter: true}
  - {outlet: Seu Dinheiro, domain: seudinheiro.com, country: BR, prefilter: true}
  - {outlet: InfoMoney, domain: infomoney.com.br, country: BR, prefilter: true}
