name: Coleta noturna (acumulador)

# A cada 2 horas, das 13:41 às 03:41 BRT, todos os dias (inclui fim de semana, para a janela de segunda).
# Só coleta feeds/sitemaps/GDELT e guarda os itens datados — não chama o Claude nem envia e-mail.
# Assim, o clipping das 05:17 usa também notícias que já saíram do feed do RSS.app (que guarda só ~20 itens)
# ou que um feed lento mostrou só por algumas horas. Para coletar de hora em hora, troque por "41 16-23,0-6 * * *".
on:
  schedule:
    - cron: "41 16,18,20,22,0,2,4,6 * * *"
  workflow_dispatch:

concurrency:
  group: clipping
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: state
          key: clipping-state-${{ github.run_id }}
          restore-keys: clipping-state-
      - name: Coletar
        run: python -m clipping --collect-only
      - name: Salvar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: clipping-state-${{ github.run_id }}
